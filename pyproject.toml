[project]
name = "the-essence-of-data-visualisation"
version = "0.1.0"
description = "The Essence of Data Visualisation at PyCon Africa 2026"
long-description = {text = """\
Learn how position, colour, size and text show data. Build plots with \
plotnine and tables with great-tables, then use Uganda census figures \
to find errors that are hard to spot in a plain table.\
""", content-type = "text/markdown"}
requires-python = ">=3.11"
dependencies = [
    "plotnine>=0.16.0a15",
    "great-tables==1.0.0",
    "pandas",
    "jupyter>=1.1.1",
]
